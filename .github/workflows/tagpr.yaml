name: tagpr

on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: Songmu/tagpr@1fcd7292d1fe8ea9a8313eef46b8d80b7a15d227 # v1.21.3
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docker-image:
    needs: [tagpr]
    if: ${{ needs.tagpr.outputs.tag != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/wf-build-and-push-docker-image.yaml
    with:
      image_name: ${{ github.repository }}
      push: true
      version: ${{ needs.tagpr.outputs.tag }}
      save-cache: true

  release-deploy-yaml:
    needs: [tagpr]
    if: ${{ needs.tagpr.outputs.tag != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
      - name: Build deploy.yaml
        run: |
          kubectl kustomize -o deploy.yaml ./deploy
      - name: Upload deploy.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            --clobber \
            --repo ${{ github.repository }} \
            ${{ needs.tagpr.outputs.tag }} \
            deploy.yaml

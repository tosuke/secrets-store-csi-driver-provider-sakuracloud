name: Go Lint

on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false

jobs:
  golangci-lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Aqua
        uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.66.1
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          skip-save-cache: ${{ inputs.save-cache != 'true' }}

  license-check:
    runs-on: ubuntu-24.04-arm
    env:
      # renovate: datasource=go depName=github.com/google/go-licenses
      GOLICENSES_VERSION: 1.6.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v${{ env.GOLICENSES_VERSION }}
      - name: Check license compliance
        # asm's MIT-0 license is bundled explicitly in Dockerfile.
        run: go-licenses check ./... --ignore=github.com/segmentio/asm/

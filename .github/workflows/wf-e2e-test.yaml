name: E2E Test

on:
  workflow_call:
    inputs:
      is-pr:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(inputs.is-pr && '["v1.33.1"]' || '["v1.31.6", "v1.32.3", "v1.33.1"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Install Aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0

      - name: Create kind cluster
        run: |
          kind create cluster --config e2e/kind.yaml --wait 300s --image "kindest/node:$K8S_VERSION"
        env:
          K8S_VERSION: ${{ matrix.k8s-version }}

      - name: Run E2E tests
        run: |
          make e2e-test

      - name: Cleanup kind cluster
        if: always()
        run: |
          kind delete cluster || true

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            e2e:
              - .github/workflows/wf-e2e-test.yaml
              - '**/*.go'
              - go.mod
              - go.sum
              - 'e2e/**'
              - Dockerfile
              - aqua.yaml

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    if: failure()
    permissions: {}
    needs: [changes, go-test, go-lint, build-image, e2e-test]
    steps: [{ run: exit 1 }]

  go-test:
    name: Go Test
    uses: ./.github/workflows/wf-go-test.yaml
    with:
      save-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

  go-lint:
    name: Go Lint
    uses: ./.github/workflows/wf-go-lint.yaml
    with:
      save-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

  build-image:
    name: Build Docker Image
    uses: ./.github/workflows/wf-build-and-push-docker-image.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: ${{ github.repository }}
      push: false
      save-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

  e2e-test:
    name: E2E Test
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/wf-e2e-test.yaml
    with:
      is-pr: ${{ github.event_name == 'pull_request' }}
